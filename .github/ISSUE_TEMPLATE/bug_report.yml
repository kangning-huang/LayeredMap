name: Bug report
description: Something in NimbleMap doesn't work as it should.
title: "[Bug]: "
labels: ["unconfirmed possible issue"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem. Reports start as **unconfirmed possible issue**; once a maintainer reproduces it, it becomes a **bug**.
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/kangning-huang/LayeredMap/issues) and did not find a duplicate.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      placeholder: When I open X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open '...'
        2. Click '...'
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Help › About NimbleMap, or `git rev-parse --short HEAD` if you built it yourself.
      placeholder: 0.6.1 / abc1234
  - type: input
    id: os
    attributes:
      label: Operating system and Mac or PC
      description: e.g. macOS 15 (Apple M2), Windows 11 on a laptop at 125 % scaling.
  - type: textarea
    id: data
    attributes:
      label: Sample data
      description: If the bug is tied to a file, attach a small sample or a link so we can reproduce it. Only share data you are allowed to share.
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or logs
      description: 'Screenshots help. If the app closed unexpectedly, attach the newest crash log from `~/Library/Logs/LayeredMap` (macOS) or `%LOCALAPPDATA%\LayeredMap\Logs` (Windows). Read it first: it can include file paths or layer names.'
