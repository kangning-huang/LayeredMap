name: Feature request
description: Suggest something NimbleMap should do, or do better.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Before you start
      options:
        - label: I searched the [existing issues](https://github.com/kangning-huang/LayeredMap/issues) and did not find a duplicate request.
          required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The map, file or question you were working with, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: Sketches, screenshots or examples from other apps are welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do now instead
