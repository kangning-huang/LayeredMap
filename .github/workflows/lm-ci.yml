# LayeredMap CI (build plan WP0.1): `cargo xtask ci` and a NimbleMap.app and .dmg on macOS arm64
# for every push to a phase or task branch, and for pull requests. Signing and notarization run
# when the Apple Developer secrets are present (docs/lm/signing.md); otherwise the app is ad-hoc
# signed. `security` runs cargo audit and cargo deny and writes the SBOM (WP6.8, docs/lm/security.md).
# `windows` runs the same `cargo xtask ci` on Windows x64 (WP6.2, Gate 6: every suite on both
# systems), and `windows-installer` builds the Free installer, signed when a Windows signing
# account is configured (docs/lm/signing.md), unsigned otherwise (docs/lm/windows.md).
# `linux-tarball` builds the portable Free tarball for Linux x64 (best effort, unsigned;
# docs/lm/linux.md).
# The workflow and job names keep "LayeredMap": they are the status-check names branch rules
# refer to (the app was renamed NimbleMap; docs/lm/naming.md).
name: LayeredMap CI

on:
  push:
    branches: [main, "phase-*", "wp/*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: lm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: xtask ci (macOS arm64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask ci (fmt, clippy, tests, layering incl. lm-*)
        run: cargo xtask ci

  windows:
    name: xtask ci (Windows x64)
    runs-on: windows-latest
    steps:
      # Byte-for-byte checkouts: fixtures and approved files are compared by content, and some
      # fixture paths are long.
      - name: Git settings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The same suites as macOS. Pixel snapshots are skipped here (#[ignore] off macOS: the
      # approved images come from the Mac's GPU and rasteriser); every other test runs, the
      # 125 % / 150 % layout checks included.
      - name: cargo xtask ci (fmt, clippy, tests, layering incl. lm-*)
        run: cargo xtask ci

  windows-installer:
    name: LayeredMap installer (Windows x64)
    runs-on: windows-latest
    needs: windows
    env:
      HAS_WINDOWS_SIGNING: ${{ secrets.LM_ARTIFACT_SIGNING_ENDPOINT != '' }}
    steps:
      - name: Git settings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      # Azure Artifact Signing (formerly Trusted Signing), when the owner has an account: signtool
      # signs through Microsoft's dlib, which signs in Azure with the app registration below. The
      # client package's name and the timestamp address are to be checked when the account exists
      # (docs/lm/signing.md › Windows).
      - name: Set up Azure Artifact Signing
        if: env.HAS_WINDOWS_SIGNING == 'true'
        shell: pwsh
        env:
          ENDPOINT: ${{ secrets.LM_ARTIFACT_SIGNING_ENDPOINT }}
          ACCOUNT: ${{ secrets.LM_ARTIFACT_SIGNING_ACCOUNT }}
          PROFILE: ${{ secrets.LM_ARTIFACT_SIGNING_PROFILE }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "signing"
          nuget install Microsoft.Trusted.Signing.Client -ExcludeVersion -OutputDirectory $dir
          $dlib = (Get-ChildItem -Recurse -Path $dir -Filter Azure.CodeSigning.Dlib.dll | Where-Object { $_.FullName -match "x64" } | Select-Object -First 1).FullName
          $meta = Join-Path $dir "metadata.json"
          @{ Endpoint = $env:ENDPOINT; CodeSigningAccountName = $env:ACCOUNT; CertificateProfileName = $env:PROFILE } | ConvertTo-Json | Set-Content $meta
          "LM_SIGNTOOL_ARGS=/fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 /dlib $dlib /dmdf $meta" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Installer (signed when configured)
        shell: pwsh
        env:
          LM_BUILD_NUMBER: ${{ github.run_number }}
          LM_UPDATE_FEED_URL: ${{ vars.LM_UPDATE_FEED_URL }}
          # The account config (public: the sign-in service's URL and public key). Unset, the
          # installer can't sign in and Pro stays locked (docs/lm/accounts.md).
          LM_ACCOUNT_CONFIG_JSON: ${{ vars.LM_ACCOUNT_CONFIG_JSON }}
          AZURE_TENANT_ID: ${{ secrets.LM_AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.LM_AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.LM_AZURE_CLIENT_SECRET }}
        run: packaging/lm/windows/build-installer.ps1 -OutDir dist/lm
      - uses: actions/upload-artifact@v7
        with:
          name: NimbleMap-windows-x64
          path: dist/lm/*-windows-x64-setup.exe
          if-no-files-found: error

  linux-tarball:
    name: LayeredMap tarball (Linux x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # What winit, wgpu and the clipboard link or look for when building on Linux. Most are
      # loaded at run time; the headers keep build scripts and pkg-config happy.
      - name: Build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev
      # The path rules the tarball depends on (Resources beside the executable, the XDG folders),
      # checked on Linux itself.
      - name: Platform rules on Linux
        run: cargo test --locked -p lm-core platform
      - name: Tarball
        env:
          LM_BUILD_NUMBER: ${{ github.run_number }}
        run: packaging/lm/linux/build-tarball.sh dist/lm
      - uses: actions/upload-artifact@v7
        with:
          name: NimbleMap-linux-x64
          path: dist/lm/*-linux-x64.tar.gz
          if-no-files-found: error

  wasm:
    name: lm crates build for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build lm-* (except lm-ui, lm-mapview) for the browser
        run: cargo build --locked --target wasm32-unknown-unknown -p lm-core -p lm-profile -p lm-actions -p lm-jobs -p lm-analysis -p lm-doc -p lm-net

  app:
    name: LayeredMap.app (macOS arm64)
    runs-on: macos-latest
    needs: ci
    env:
      HAS_CERT: ${{ secrets.LM_DEVELOPER_ID_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT: ${{ secrets.LM_DEVELOPER_ID_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.LM_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/lm.keychain-db"; kcpw="$(uuidgen)"
          security create-keychain -p "$kcpw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpw" "$kc"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$kc"
          security set-key-partition-list -S apple-tool:,apple: -k "$kcpw" "$kc"
          security list-keychain -d user -s "$kc"
      - name: Bundle and disk image (sign, notarize and staple when configured)
        env:
          LM_BUILD_NUMBER: ${{ github.run_number }}
          LM_SIGN_IDENTITY: ${{ secrets.LM_SIGN_IDENTITY }}
          LM_NOTARY_APPLE_ID: ${{ secrets.LM_NOTARY_APPLE_ID }}
          LM_NOTARY_TEAM_ID: ${{ secrets.LM_NOTARY_TEAM_ID }}
          LM_NOTARY_PASSWORD: ${{ secrets.LM_NOTARY_PASSWORD }}
          LM_DOWNLOAD_BASE: ${{ vars.LM_DOWNLOAD_BASE }}
          LM_ACCOUNT_CONFIG_JSON: ${{ vars.LM_ACCOUNT_CONFIG_JSON }}
        run: packaging/lm/build-dmg.sh dist/lm
      - uses: actions/upload-artifact@v7
        with:
          name: NimbleMap-macos-arm64
          path: |
            dist/lm/*.zip
            dist/lm/*.dmg
            dist/lm/update-feed.json
          if-no-files-found: warn

  security:
    name: cargo audit, cargo deny, SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit and cargo-deny
        run: cargo install --locked cargo-audit cargo-deny
      - name: cargo audit (RustSec advisories; exceptions in .cargo/audit.toml)
        run: cargo audit
      - name: cargo deny check (advisories, licences, bans, sources; deny.toml)
        run: cargo deny check
      - name: Software bill of materials (CycloneDX)
        run: cargo xtask sbom --out dist/lm/layeredmap.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: NimbleMap-sbom
          path: dist/lm/layeredmap.cdx.json

  spike:
    name: Rendering spike build (Phase 0)
    runs-on: macos-latest
    needs: ci
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p lm-render-spike
      - uses: actions/upload-artifact@v7
        with:
          name: lm-render-spike-macos-arm64
          path: target/release/lm-render-spike
