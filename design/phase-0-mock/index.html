<!doctype html>
<html lang="en" data-theme="light" class="boot">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LayeredMap</title>
<!--
  LayeredMap Phase 0 design-track mock (build plan WP0.7).
  Single offline file. Generated by src/build.py from src/template.html — edit the template, then rebuild.
  Test states: #launch #importing #workspace #district=D11 #district=D17&compare=july_temp_c #school=1
               #layer=schools #layer=schools&tab=details #layer=districts&color=july_temp_c #count #rank=july_temp_c
               add &dark for the dark theme, &popover=more for the More actions menu, &selftest for the check result in the title.
-->
<style>
:root{
  --surface:#FFFFFF; --surface-raised:#F6F7F9; --border:#E3E5E8;
  --text-primary:#1B1D21; --text-secondary:#5F6670;
  --accent:#2563EB; --on-accent:#FFFFFF; --accent-weak:#DCE7FD;
  --assumption:#6D4FD1; --warning:#B45309; --critical:#B91C1C; --success:#15803D;
  --shadow:0 2px 8px rgba(0,0,0,.12); --halo:#FFFFFF; --nodata:#D0D3D8;
  /* basemap (mock, not spec tokens) */
  --land:#F2EFE9; --land-line:#DCD6CC; --water:#CBDDEB; --water-label:#56738C; --map-label:#5F6670; --river:#B4CCE0; --bar:#C3C8CF;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --surface:#1E1F22; --surface-raised:#2A2B2F; --border:#3A3C41;
  --text-primary:#F1F2F4; --text-secondary:#A9AEB6;
  --accent:#5B8DEF; --on-accent:#0B1220; --accent-weak:#24324F;
  --assumption:#A78BFA; --warning:#F59E0B; --critical:#F87171; --success:#4ADE80;
  --shadow:none; --halo:#000000;
  --land:#2B2D31; --land-line:#3C3F45; --water:#18222D; --water-label:#7F95AA; --map-label:#9AA0A8; --river:#23374A; --bar:#4B4F56;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC","Hiragino Sans GB","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  font-size:14px;line-height:20px;color:var(--text-primary);background:var(--water);
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  min-width:1024px;min-height:640px;-webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit}
.caption{font-size:12px;line-height:16px;color:var(--text-secondary)}
.label{font-size:14px;line-height:20px;font-weight:600}
.headline{font-size:16px;line-height:22px;font-weight:600}
.title{font-size:20px;line-height:26px;font-weight:600}
.big{font-size:28px;line-height:32px;font-weight:600}
.sec{color:var(--text-secondary)}
.ico{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ico.i18{width:18px;height:18px}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ---------- map ---------- */
#map{position:fixed;inset:0;cursor:default;touch-action:none;user-select:none;-webkit-user-select:none}
#map.dragging{cursor:grabbing}
#mapsvg{width:100%;height:100%;display:block}
.land{fill:var(--land);stroke:var(--land-line);stroke-width:1}
.lake{fill:var(--water);stroke:none}
.river{fill:none;stroke:var(--river);stroke-width:1.5}
.blabel{font-size:12px;fill:var(--map-label);paint-order:stroke;stroke:var(--land);stroke-width:3px;stroke-linejoin:round}
.blabel.city{font-weight:600}
.blabel.water{fill:var(--water-label);stroke:var(--water);font-style:italic;letter-spacing:.04em}
.feat{cursor:pointer}
.feat.area{stroke-width:1}
.feat.area:hover{stroke:var(--hs);stroke-width:1}
.feat.pt{stroke:#FFFFFF;stroke-width:1.5}
.feat.pt:hover{stroke:var(--hs)}
.selhalo{fill:none;stroke:var(--halo);stroke-width:7;pointer-events:none;stroke-linejoin:round}
.selline{fill:none;stroke:var(--accent);stroke-width:3;pointer-events:none;stroke-linejoin:round}

/* ---------- chrome ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
#toolbar{position:fixed;top:0;left:0;right:0;height:52px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 12px;gap:4px;z-index:20}
#brand{display:flex;align-items:center;gap:8px;width:170px;flex:none;font-weight:600}
#brand .mark{width:20px;height:20px;border-radius:5px;background:linear-gradient(135deg,#009E73 0 50%,#E69F00 50% 100%)}
.tb-spacer{flex:1 1 0}
.tb-spacer.r{flex:1.6 1 0}
#search{position:relative;flex:0 1 480px;min-width:280px}
#search input{width:100%;height:36px;border-radius:6px;border:1px solid var(--border);background:var(--surface-raised);color:var(--text-primary);padding:0 12px 0 34px;font:inherit}
#search input::placeholder{color:var(--text-secondary)}
#search input:focus{outline:2px solid var(--accent);outline-offset:-1px;background:var(--surface)}
#search .ico{position:absolute;left:10px;top:9px;color:var(--text-secondary)}
.tbtn{height:36px;min-width:36px;display:inline-flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;white-space:nowrap}
.tbtn:hover:not(:disabled){background:var(--surface-raised)}
.tbtn:disabled{color:var(--text-secondary);opacity:.55;cursor:default}
.tbtn.on{background:var(--accent-weak)}
.tbtn .caret{width:12px;height:12px;margin-left:-2px}
.tb-sep{width:1px;height:24px;background:var(--border);margin:0 4px}

#shelf{position:fixed;top:64px;left:12px;width:280px;padding:8px 0 8px;z-index:12;max-height:calc(100vh - 76px - 48px);overflow:auto}
#shelf .shead{display:flex;align-items:center;justify-content:space-between;padding:0 12px 4px 16px}
.lrow{height:32px;display:flex;align-items:center;gap:8px;margin:0 6px;padding:0 8px 0 2px;border-radius:6px;cursor:pointer;position:relative}
.lrow:hover{background:var(--surface-raised)}
.lrow.sel{background:var(--accent-weak)}
.lrow .eye{width:32px;height:32px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--text-secondary);flex:none}
.lrow .eye:hover{color:var(--text-primary)}
.lrow.hidden .lname,.lrow.hidden .swatch{opacity:.45}
.lname{flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden}
.lprog{font-size:12px;color:var(--text-secondary);white-space:nowrap}
.swatch{width:16px;height:16px;flex:none;border-radius:4px}
.swatch.area{background:color-mix(in srgb,var(--c) 35%,var(--surface));border:1px solid var(--c2)}
.swatch.pt{display:grid;place-items:center}
.swatch.pt::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 0 1.5px #fff}
.badge{width:20px;height:20px;display:grid;place-items:center;flex:none;border:0;background:transparent;padding:0;cursor:pointer;border-radius:4px}
.adot{width:8px;height:8px;border-radius:50%;background:var(--assumption);display:inline-block;flex:none}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.lrow.add{color:var(--text-secondary);padding-left:10px;gap:10px}
.lrow.add:hover{color:var(--text-primary)}
.minilegend{margin:0 12px 6px 44px}

#inspector{position:fixed;top:64px;right:12px;width:360px;max-height:calc(100vh - 76px);overflow:auto;z-index:12;padding:0}
#inspector[hidden]{display:none}
#inspector.enter{animation:pin 180ms ease-out}
#inspector.leave{animation:pout 140ms ease-out forwards}
@keyframes pin{from{opacity:0;transform:translateX(12px)}to{opacity:1;transform:none}}
@keyframes pout{from{opacity:1;transform:none}to{opacity:0;transform:translateX(12px)}}
.ibody{padding:16px}
.ibody.fade{animation:fade 120ms ease-out}
@keyframes fade{from{opacity:.0}to{opacity:1}}
.ihead{display:flex;align-items:flex-start;gap:8px;margin-bottom:12px}
.ihead .tx{flex:1;min-width:0}
.ihead .title{overflow-wrap:anywhere}
.iconbtn{width:36px;height:36px;border:0;background:transparent;border-radius:6px;display:grid;place-items:center;cursor:pointer;color:var(--text-secondary);flex:none;margin:-6px -8px 0 0}
.iconbtn:hover{background:var(--surface-raised);color:var(--text-primary)}
.card{background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;padding:12px}
.stack>*+*{margin-top:12px}
.irow{display:flex;gap:12px;align-items:flex-start}
.irow+.irow{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
.irow .m{flex:1;min-width:0}
.irow .v{font-weight:600}
.irow .rk{color:var(--text-primary);white-space:nowrap}
.strip{flex:none;margin-top:16px;overflow:visible}
.hint{color:var(--text-secondary)}
.sect-h{font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:600;margin:0 0 6px}
dl.facts{display:grid;grid-template-columns:minmax(0,40%) 1fr;gap:4px 12px;margin:0}
dl.facts dt{color:var(--text-secondary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
dl.facts dd{margin:0;overflow-wrap:anywhere}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);cursor:pointer;font:inherit;min-height:32px;display:inline-flex;align-items:center}
.linkbtn:hover{text-decoration:underline}
.actbtn{display:flex;align-items:center;width:100%;min-height:36px;padding:7px 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-align:left;gap:8px}
.actbtn:hover{background:var(--surface-raised);border-color:color-mix(in srgb,var(--accent) 45%,var(--border))}
.actbtn+.actbtn{margin-top:8px}
.actbtn b{font-weight:600}
.actbtn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.more{margin-top:4px}
.ifoot{display:flex;gap:8px;align-items:center;border-top:1px solid var(--border);margin:16px -16px -16px;padding:2px 16px}
.ifoot .dotsep{color:var(--text-secondary)}
.tabs{display:flex;gap:4px;padding:8px 12px 0;border-bottom:1px solid var(--border)}
.tab{border:0;background:transparent;height:36px;padding:0 10px;cursor:pointer;color:var(--text-secondary);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text-primary);border-bottom-color:var(--accent);font-weight:600}
.tabs .iconbtn{margin:0 0 0 auto}
.assume{display:flex;gap:8px;align-items:baseline}
.assume .adot{transform:translateY(-1px)}
.notice{display:flex;gap:8px;align-items:flex-start;color:var(--text-primary)}
.notice .ico{color:var(--warning);margin-top:2px}
.btn{height:32px;padding:0 12px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-raised)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.07)}
.fsum{display:flex;align-items:center;gap:12px}
.fsum+.fsum{margin-top:10px}
.fsum .m{flex:1;min-width:0}
.token{display:inline-flex;align-items:center;gap:2px;background:var(--accent-weak);color:var(--text-primary);border:0;border-radius:6px;padding:1px 6px;font-weight:600;cursor:pointer}
.token .ico{width:12px;height:12px}
.rank{margin-top:8px}
.crow{display:grid;grid-template-columns:22px minmax(0,1fr) 84px 58px;align-items:center;gap:6px;width:100%;min-height:26px;border:0;background:transparent;padding:0 4px;border-radius:4px;cursor:pointer;text-align:left}
.crow:hover{background:var(--surface)}
.crow.me{background:var(--accent-weak)}
.crow .n{color:var(--text-secondary);font-size:12px;text-align:right}
.crow .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .val{text-align:right;white-space:nowrap}
.crow svg{display:block}
.axis{display:grid;grid-template-columns:22px minmax(0,1fr) 84px 58px;gap:6px;padding:0 4px}
.legend{display:flex;flex-direction:column;gap:6px}
.lg-item{display:flex;align-items:center;gap:8px}
.ramp{height:10px;border-radius:2px;width:160px}
.hatch{width:16px;height:12px;border-radius:2px;background:repeating-linear-gradient(45deg,#D0D3D8 0 3px,#AEB3BA 3px 4px)}
.chip{display:inline-block;font-size:12px;line-height:16px;padding:1px 6px;border-radius:10px;background:var(--surface-raised);border:1px solid var(--border);white-space:nowrap}
.chip.measure{border-color:color-mix(in srgb,var(--accent) 40%,var(--border))}
.chip.id{color:var(--text-secondary)}
table.ftab{width:100%;border-collapse:collapse;font-size:12px;line-height:16px}
table.ftab td{padding:5px 4px;border-top:1px solid var(--border);vertical-align:top}
table.ftab td:first-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;white-space:nowrap}
.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:0}
.kv dt{color:var(--text-secondary)}
.kv dd{margin:0;overflow-wrap:anywhere}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
pre.recipe{white-space:pre-wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:16px;background:var(--surface-raised);border:1px solid var(--border);border-radius:8px;padding:8px;margin:8px 0}
details>summary{cursor:pointer;color:var(--accent);min-height:32px;display:flex;align-items:center}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;min-height:32px;cursor:pointer}
.palettes{display:flex;flex-wrap:wrap;gap:8px}
.pal{display:flex;flex-direction:column;gap:4px;border:1px solid var(--border);border-radius:6px;padding:6px;background:var(--surface);cursor:pointer;font-size:12px}
.pal.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.pal .ramp{width:72px}

#controls{position:fixed;right:12px;bottom:32px;display:flex;flex-direction:column;gap:8px;z-index:11;transition:right 180ms ease-out}
#controls.shift{right:384px}
.cgroup{display:flex;flex-direction:column;border-radius:8px;overflow:hidden}
.cbtn{width:36px;height:36px;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--text-primary)}
.cbtn:hover{background:var(--surface-raised)}
.cgroup .cbtn+.cbtn{border-top:1px solid var(--border)}
#attrib{position:fixed;right:12px;bottom:6px;font-size:12px;line-height:16px;color:var(--text-secondary);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:1px 6px;z-index:11;transition:right 180ms ease-out;white-space:nowrap}
#attrib.shift{right:384px}
#scalebar{position:fixed;left:12px;bottom:12px;z-index:11;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:2px 8px 4px;font-size:12px;line-height:16px;color:var(--text-primary)}
#scalebar .bar{height:5px;border:1.5px solid var(--text-primary);border-top:0;margin-top:1px}

#welcome{position:fixed;left:50%;bottom:48px;transform:translateX(-50%);width:420px;padding:24px;z-index:14;text-align:center}
#welcome .headline{margin:4px 24px 16px}
#welcome .btnrow{justify-content:center}
#welcome .iconbtn{position:absolute;top:10px;right:10px;margin:0}
#welcome .btn{height:36px;padding:0 16px}

#popover{position:fixed;z-index:40;min-width:220px;max-width:340px;padding:6px;border-radius:8px}
#popover[hidden]{display:none}
.pitem{display:flex;align-items:center;gap:8px;width:100%;min-height:32px;border:0;background:transparent;border-radius:6px;padding:4px 8px;text-align:left;cursor:pointer}
.pitem:hover:not(:disabled),.pitem.kb{background:var(--surface-raised)}
.pitem:disabled{cursor:default;color:var(--text-secondary)}
.pitem .r{margin-left:auto;font-size:12px;color:var(--text-secondary)}
.pgroup{font-size:12px;line-height:16px;color:var(--text-secondary);font-weight:600;padding:8px 8px 2px}
.psep{height:1px;background:var(--border);margin:4px 0}

#scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:30;display:grid;place-items:center}
#scrim[hidden]{display:none}
#dialog{width:480px;padding:20px}
.frow{display:flex;align-items:center;gap:10px;min-height:36px;padding:0 8px;border-radius:6px}
.frow:hover{background:var(--surface-raised)}
.ficon{width:22px;height:26px;border-radius:3px;border:1px solid var(--border);background:var(--surface-raised);font-size:8px;line-height:10px;display:grid;place-items:end center;padding-bottom:2px;color:var(--text-secondary);font-weight:600}

#toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);z-index:45;padding:8px 14px;border-radius:8px;background:var(--text-primary);color:var(--surface);font-size:14px;box-shadow:var(--shadow);pointer-events:none;opacity:0;transition:opacity 150ms}
#toast.on{opacity:1}

#observer{position:fixed;left:12px;bottom:48px;width:420px;max-height:50vh;overflow:auto;z-index:50;padding:12px}
#observer[hidden]{display:none}
#observer pre{font-size:11px;line-height:15px;white-space:pre-wrap;margin:8px 0 0}
html.boot #controls,html.boot #attrib{transition:none}
@media (prefers-reduced-motion: reduce){
  #inspector.enter,#inspector.leave,.ibody.fade{animation:none}
  #controls,#attrib{transition:none}
  .spin{animation-duration:2.4s}
}
</style>
</head>
<body>
<div id="map"><svg id="mapsvg" xmlns="http://www.w3.org/2000/svg" aria-label="Map">
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#D0D3D8"/><line x1="0" y1="0" x2="0" y2="6" stroke="#9CA2AA" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g id="g-land"></g><g id="g-lakes"></g><g id="g-rivers"></g><g id="g-blabels"></g><g id="g-data"></g><g id="g-sel"></g>
</svg></div>

<header id="toolbar">
  <div id="brand"><span class="mark" aria-hidden="true"></span>LayeredMap</div>
  <div class="tb-spacer"></div>
  <div id="search"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4.5 4.5"/></svg>
    <input id="q" type="search" placeholder="Search places or your data" autocomplete="off" spellcheck="false" aria-label="Search places or your data"></div>
  <div class="tb-spacer r"></div>
  <button class="tbtn" id="b-open" title="Open (⌘O)"></button>
  <button class="tbtn" id="b-layers" title="Show or hide the layer shelf (⌘L)"></button>
  <button class="tbtn" id="b-undo" disabled></button>
  <button class="tbtn" id="b-share" disabled></button>
  <span class="tb-sep"></span>
  <button class="tbtn" id="b-theme" title="Switch theme (mock only)" aria-label="Switch theme"></button>
</header>

<aside id="shelf" class="panel" hidden></aside>
<aside id="inspector" class="panel" hidden aria-live="polite"></aside>

<div id="controls">
  <div class="cgroup panel">
    <button class="cbtn" id="c-in" title="Zoom in (+)" aria-label="Zoom in"></button>
    <button class="cbtn" id="c-out" title="Zoom out (−)" aria-label="Zoom out"></button>
  </div>
  <div class="cgroup panel"><button class="cbtn" id="c-base" title="Basemap" aria-label="Basemap"></button></div>
</div>
<div id="scalebar"><div id="sb-label">—</div><div class="bar" id="sb-bar"></div></div>
<div id="attrib">Basemap drawn for this mock · Data: synthetic fixtures V1, T1</div>

<section id="welcome" class="panel" hidden>
  <button class="iconbtn" id="w-close" aria-label="Close"></button>
  <div class="headline">Open a file to see your data on the map.</div>
  <div class="btnrow"><button class="btn primary" id="w-open">Open file…</button><button class="btn" id="w-example">Try an example</button></div>
</section>

<div id="popover" class="panel" hidden role="menu"></div>
<div id="scrim" hidden><div id="dialog" class="panel" role="dialog" aria-modal="true"></div></div>

  var L = layer(layerId), f = L && L.byId[id]; if(!f) return;
  var keepCompare = S.compare && S.sel && S.sel.layer === layerId ? S.compare : null;
  S.sel = {layer:layerId, id:id}; S.active = layerId; S.insp = 'object'; S.inline = null; S.factsAll = false; S.compare = keepCompare; S.result = null;
  log('select ' + L.one, f.name + (via ? ' (' + via + ')' : ''));
  renderAll(true);
}
function clearSelection(){ S.sel = null; S.inline = null; S.compare = null; if(S.active){ S.insp = 'layer'; S.tab = 'overview'; } else S.insp = null; renderAll(true); }
function selectLayer(id){ S.sel = null; S.active = id; S.insp = 'layer'; S.tab = 'overview'; S.inline = null; S.compare = null; S.result = null; log('select layer', layer(id).display); renderAll(true); }
function closeInspector(){ S.insp = null; S.sel = null; S.compare = null; S.inline = null; S.result = null; renderAll(true); }

// ================================================================ rendering: toolbar, shelf
function renderToolbar(){
  $('#b-open').innerHTML = icon('open', 'i18') + 'Open';
  $('#b-layers').innerHTML = icon('layers', 'i18') + 'Layers';
  $('#b-layers').classList.toggle('on', !$('#shelf').hidden);
  var u = $('#b-undo'); u.innerHTML = icon('undo', 'i18') + 'Undo'; u.disabled = !S.undo.length; u.title = S.undo.length ? 'Undo ' + S.undo[S.undo.length - 1].label + ' (⌘Z)' : 'Nothing to undo';
  var sh = $('#b-share'); sh.innerHTML = icon('share', 'i18') + 'Share' + icon('caret', 'caret'); sh.disabled = !loaded().length; sh.title = 'Share';
  $('#b-theme').innerHTML = icon(S.theme === 'dark' ? 'sun' : 'moon', 'i18');
  $('#c-in').innerHTML = icon('plus', 'i18'); $('#c-out').innerHTML = icon('minus', 'i18'); $('#c-base').innerHTML = icon('map', 'i18');
  $('#w-close').innerHTML = icon('x');
}
function swatchHTML(L){
  if(L.style.mode === 'value') return '<span class="swatch" style="background:' + rampCss(L.style.palette) + '"></span>';
  return '<span class="swatch ' + (L.kind === 'area' ? 'area' : 'pt') + '" style="--c:' + L.color + ';--c2:' + shade(L.color, -.3) + '"></span>';
}
function legendHTML(L, compact){
  if(L.style.mode === 'value'){
    var fd = L.fieldBy[L.style.field], st = L.stats[L.style.field];
    return '<div class="legend">' + (compact ? '' : '<div class="caption">' + esc(fd.label) + (fd.unit ? ' (' + fd.unit + ')' : '') + '</div>') +
      '<div><div class="ramp" style="background:' + rampCss(L.style.palette) + '"></div><div class="caption" style="display:flex;justify-content:space-between;width:160px"><span>' + fmtVal(fd, st, st.min) + '</span><span>' + fmtVal(fd, st, st.max) + '</span></div></div>' +
      '<div class="lg-item caption"><span class="hatch"></span>No data' + (st.missing ? ' (' + fmt(st.missing) + ')' : '') + '</div></div>';
  }
  return '<div class="lg-item">' + swatchHTML(L) + '<span>' + esc(L.display) + '</span></div>';
}
function renderShelf(){
  var sh = $('#shelf');
  var narrow = W < 1180;
  sh.hidden = !S.layers.length || !S.shelfOpen || (narrow && !S.shelfForced);
  if(sh.hidden){ renderToolbar(); return; }
  var html = '<div class="shead"><span class="headline">Layers</span></div>';
  S.layers.slice().reverse().forEach(function(L){
    var badge = '';
    if(L.status === 'loading') badge = '<span class="badge" title="Working"><span class="spin"></span></span>';
    else if(L.assumptions && L.assumptions.length) badge = '<button class="badge" data-act="assume" data-layer="' + L.id + '" title="Visible assumption: ' + esc(L.assumptions[0].text) + ' Open Details."><span class="adot"></span></button>';
    var name = L.status === 'loading' ? L.file : L.display;
    var prog = L.status === 'loading' ? '<span class="lprog">Reading ' + fmt(L.bytes * L.progress / 1024, 1) + ' of ' + fmt(L.bytes / 1024, 1) + ' KB</span>' : '';
    if(L.status === 'loading'){ html += '<div class="lrow" data-layer="' + L.id + '" title="' + esc(name) + '"><span class="eye"><span class="spin"></span></span><span class="lname">' + esc(truncMid(name, 13)) + '</span>' + prog + '</div>'; return; }
    html += '<div class="lrow' + (S.active === L.id && S.insp ? ' sel' : '') + (L.visible ? '' : ' hidden') + '" data-layer="' + L.id + '" role="button" tabindex="0" title="' + esc(name) + '">' +
      '<button class="eye" data-act="eye" data-layer="' + L.id + '" aria-label="' + (L.visible ? 'Hide ' : 'Show ') + esc(L.display) + '" title="' + (L.visible ? 'Hide' : 'Show') + '">' + icon(L.visible ? 'eye' : 'eyeoff') + '</button>' +
      (L.status === 'ok' ? swatchHTML(L) : '<span class="swatch"></span>') + '<span class="lname">' + esc(truncMid(name, 26)) + '</span>' + prog + badge + '</div>';
    if(L.status === 'ok' && L.style.mode === 'value' && L.visible) html += '<div class="minilegend">' + legendHTML(L, true) + '</div>';
  });
  html += '<div class="lrow add" data-act="open" role="button" tabindex="0">' + icon('plus') + '<span>Open file</span></div>';
  sh.innerHTML = html;
  renderToolbar();
}

// ================================================================ rendering: inspector
var lastInspKey = '', BOOT = true;
function renderInspector(animateIn){
  var box = $('#inspector'), was = !box.hidden;
  if(!S.insp){
    if(was && !RM.matches && !BOOT){ box.classList.remove('enter'); box.classList.add('leave'); setTimeout(function(){ if(!S.insp){ box.hidden = true; box.classList.remove('leave'); } }, 140); }
    else box.hidden = true;
    $('#controls').classList.remove('shift'); $('#attrib').classList.remove('shift');
    return;
  }
  var html = '';
  if(S.insp === 'object') html = objectCardHTML(selFeature());
  else if(S.insp === 'layer') html = layerOverviewHTML(layer(S.active));
  else if(S.insp === 'result') html = resultHTML();
  var key = S.insp + (S.sel ? S.sel.id : '') + S.active + S.tab;
  var st = box.scrollTop;
  box.innerHTML = html;
  box.classList.remove('leave');
  if(!was){ box.hidden = false; if(!RM.matches && !BOOT){ box.classList.remove('enter'); void box.offsetWidth; box.classList.add('enter'); } }
  else if(key !== lastInspKey){ var b = $('.ibody', box); if(b && !RM.matches && !BOOT) b.classList.add('fade'); box.scrollTop = 0; }
  else box.scrollTop = st;
  lastInspKey = key;
  $('#controls').classList.add('shift'); $('#attrib').classList.add('shift');
  if(S.scrollTo){ var t = $('#' + S.scrollTo, box); if(t) t.scrollIntoView({block:'start'}); S.scrollTo = null; }
}

function dotStrip(st, v){
  var w = 120, h = 28, pad = 6, sx = function(x){ return pad + (w - 2 * pad) * ((x - st.min) / ((st.max - st.min) || 1)); };
  var s = '<svg class="strip" width="120" height="28" viewBox="0 0 120 28" aria-hidden="true">';
  s += '<line x1="' + pad + '" x2="' + (w - pad) + '" y1="14" y2="14" stroke="var(--border)" stroke-width="1"/>';
  st.vals.forEach(function(x){ var X = sx(x).toFixed(1); s += '<line x1="' + X + '" x2="' + X + '" y1="9" y2="19" stroke="var(--text-secondary)" stroke-opacity=".4" stroke-width="1"/>'; });
  var M = sx(st.median).toFixed(1); s += '<line x1="' + M + '" x2="' + M + '" y1="4" y2="24" stroke="var(--text-primary)" stroke-width="1.5"/>';
  if(v !== null && v !== undefined) s += '<circle cx="' + sx(v).toFixed(1) + '" cy="14" r="5" fill="var(--accent)" stroke="var(--surface-raised)" stroke-width="2"/>';
  return s + '</svg>';
}
function insightFields(L){
  var out = [];
  if(L.style.mode === 'value') out.push(L.style.field);
  L.fields.forEach(function(fd){ if(fd.role === 'measure' && out.indexOf(fd.key) < 0) out.push(fd.key); });
  L.fields.forEach(function(fd){ if(fd.role === 'category' && out.indexOf(fd.key) < 0) out.push(fd.key); });
  return out.slice(0, 3);
}
function insightRowHTML(L, f, key){
  var fd = L.fieldBy[key];
  if(fd.role === 'category'){
    var all = L.records || L.features, v = f.props[key], n = all.filter(function(r){ return r.props[key] === v; }).length, pct = Math.round(100 * n / all.length);
    var cats = {}; all.forEach(function(r){ cats[r.props[key]] = (cats[r.props[key]] || 0) + 1; });
    var x = 0, bar = '<svg class="strip" width="120" height="28" aria-hidden="true">';
    Object.keys(cats).sort().forEach(function(c){ var wd = 120 * cats[c] / all.length; bar += '<rect x="' + x.toFixed(1) + '" y="9" width="' + Math.max(0, wd - 1.5).toFixed(1) + '" height="10" rx="2" fill="' + (c === v ? 'var(--accent)' : 'var(--bar)') + '"/>'; x += wd; });
    bar += '</svg>';
    return '<div class="irow"><div class="m"><div class="caption">' + esc(fd.label) + '</div><div><span class="v">' + esc(v) + '</span></div><div class="rk">' + pct + '% of ' + L.noun + ' are ' + esc(v) + '</div></div>' + bar + '</div>';
  }
  var st = L.stats[key], v = f.props[key];
  if(v === null || v === undefined) return '<div class="irow"><div class="m"><div class="caption">' + esc(fd.label) + '</div><div><span class="v">No value</span></div><div class="caption">Left out of the ranking; ' + fmt(st.n) + ' of ' + fmt(st.total) + ' ' + L.noun + ' have a value</div></div>' + dotStrip(st, null) + '</div>';
  var r = rankOf(st, v);
  return '<div class="irow" data-field="' + key + '"><div class="m"><div class="caption">' + esc(fd.label) + '</div><div><span class="v">' + fmtVal(fd, st, v) + '</span>' + '</div>' + (r.phrase ? '<div class="rk">' + r.phrase + '</div>' : '') + '<div class="caption">' + diffLine(fd, st, v) + '</div></div>' + dotStrip(st, v) + '</div>';
}
function objectActions(L){
  if(L.kind === 'area'){
    var pts = companion('point'), acts = [];
    if(pts) acts.push({a:'inside', h:"What's inside?"});
    acts.push({a:'compare', h:'Compare with other <b>' + esc(L.display) + '</b>'});
    acts.push({a:'measure', h:'Measure its area'});
    if(!pts){ var cat = L.fields.filter(function(x){ return x.role === 'category'; })[0]; if(cat) acts.push({a:'filterby', h:'Filter by <b>' + esc(cat.label) + '</b>'}); }
    return acts.slice(0, 3);
  }
  var areas = companion('area');
  if(areas) return [{a:'which', h:'Which <b>' + esc(singular(areas.display)) + '</b> is it in?'}, {a:'buffer', h:'Show an area within a distance'}, {a:'measurefrom', h:'Measure from here'}];
  return [{a:'buffer', h:'Show an area within a distance'}, {a:'measurefrom', h:'Measure from here'}, {a:'filterby', h:'Filter by <b>Type</b>'}];
}
function layerActions(L){
  if(L.kind === 'area'){
    var pts = companion('point');
    if(pts) return [{a:'count', h:'Count <b>' + esc(pts.display) + '</b> in each <b>' + esc(singular(L.display)) + '</b>'}, {a:'color', h:'Color by a value'}, {a:'rank', h:'Rank <b>' + esc(L.display) + '</b> by a value'}];
    return [{a:'color', h:'Color by a value'}, {a:'rank', h:'Rank <b>' + esc(L.display) + '</b> by a value'}, {a:'filterlayer', h:'Filter <b>' + esc(L.display) + '</b>'}];
  }
  var ar = companion('area');
  if(ar) return [{a:'count', h:'Count <b>' + esc(L.display) + '</b> in each <b>' + esc(singular(ar.display)) + '</b>'}, {a:'color', h:'Color or size by a value'}, {a:'filterlayer', h:'Filter <b>' + esc(L.display) + '</b>'}];
  return [{a:'color', h:'Color or size by a value'}, {a:'filterlayer', h:'Filter <b>' + esc(L.display) + '</b>'}, {a:'buffereach', h:'Show an area within a distance of each'}];
}
function actionsHTML(acts, scope){
  return '<div>' + acts.map(function(x){ return '<button class="actbtn" data-act="' + x.a + '" data-scope="' + scope + '"><span>' + x.h + '</span></button>'; }).join('') +
    '<button class="linkbtn more" data-act="more" data-scope="' + scope + '">More actions…</button></div>';
}
function rankingHTML(L, key, meId, limit){
  var fd = L.fieldBy[key], st = L.stats[key], rows = [], miss = [];
  (L.records || L.features).forEach(function(f){ var v = f.props[key]; if(v === null || v === undefined) miss.push(f); else rows.push({f:f, v:v}); });
  rows.sort(function(a, b){ return b.v - a.v || (a.f.idx - b.f.idx); });
  var interval = fd.unit === '°C';
  var lo = interval ? Math.floor(st.min) : 0, hi = interval ? Math.ceil(st.max) : st.max, bw = 84;
  var sx = function(x){ return bw * (x - lo) / ((hi - lo) || 1); };
  var html = '<div class="axis caption"><span></span><span></span><span style="display:flex;justify-content:space-between"><span>' + fmt(lo, interval ? 0 : 0) + '</span><span>' + (interval ? fmt(hi) + ' ' + fd.unit : '') + '</span></span><span></span></div>';
  var shown = limit ? rows.slice(0, limit) : rows;
  shown.forEach(function(r){
    var rk = rankOf(st, r.v), M = sx(st.median).toFixed(1), me = r.f.id === meId, X = sx(r.v);
    var g = '<svg width="' + bw + '" height="14" aria-hidden="true">';
    if(interval){ g += '<line x1="0" x2="' + bw + '" y1="7" y2="7" stroke="var(--border)"/><line x1="' + M + '" x2="' + M + '" y1="1" y2="13" stroke="var(--text-secondary)" stroke-width="1"/><circle cx="' + X.toFixed(1) + '" cy="7" r="4.5" fill="' + (me ? 'var(--accent)' : 'var(--text-secondary)') + '"/>'; }
    else { g += '<rect x="0" y="2" width="' + Math.max(1, X).toFixed(1) + '" height="10" rx="2" fill="' + (me ? 'var(--accent)' : 'var(--bar)') + '"/><line x1="' + M + '" x2="' + M + '" y1="0" y2="14" stroke="var(--text-secondary)" stroke-width="1" stroke-dasharray="2 2"/>'; }
    g += '</svg>';
    html += '<button class="crow' + (me ? ' me' : '') + '" data-act="pick" data-layer="' + L.id + '" data-id="' + r.f.id + '" title="' + esc(r.f.name) + '"><span class="n">' + (rk.ties > 1 ? '=' : '') + rk.rt + '</span><span class="nm">' + esc(r.f.name) + '</span>' + g + '<span class="val">' + fmtVal(fd, st, r.v) + '</span></button>';
  });
  if(!limit) miss.forEach(function(f){ html += '<button class="crow' + (f.id === meId ? ' me' : '') + '" data-act="pick" data-layer="' + L.id + '" data-id="' + f.id + '"><span class="n">–</span><span class="nm">' + esc(f.name) + '</span><span class="caption">No value</span><span></span></button>'; });
  html += '<div class="caption" style="margin-top:6px">' + (interval ? 'Dots on a ' + fmt(lo) + '–' + fmt(hi) + ' ' + fd.unit + ' scale' : 'Bars start at 0') + ' · line marks the median, ' + fmtVal(fd, st, st.median) + '</div>';
  return html;
}
function objectCardHTML(f){
  if(!f) return '';
  var L = f.layer, h = '<div class="ibody">';
  var sub = L.kind === 'area' ? esc(L.display) + ' · area · ' + fmt(f.props.area_km2, 2) + ' km²' : esc(L.display) + ' · point' + (f.located ? '' : ' · no location');
  h += '<div class="ihead"><div class="tx"><div class="title">' + esc(f.name) + '</div><div class="caption">' + sub + '</div></div><button class="iconbtn" data-act="close" aria-label="Close" title="Close (Esc)">' + icon('x') + '</button></div>';
  h += '<div class="stack">';
  // insight strip
  h += '<div class="card" id="insight">' + insightFields(L).map(function(k){ return insightRowHTML(L, f, k); }).join('');
  if(S.compare){
    var fd = L.fieldBy[S.compare], st = L.stats[S.compare];
    h += '<div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--border)" id="compare"><div style="display:flex;align-items:center;justify-content:space-between"><span class="label">Compare with other ' + esc(L.display) + '</span><button class="iconbtn" style="margin:-4px -6px -4px 0;width:32px;height:32px" data-act="closecompare" aria-label="Close comparison" title="Close comparison">' + icon('x') + '</button></div>' +
      '<div style="margin:4px 0 2px">Rank all ' + fmt(st.total) + ' ' + L.noun + ' by <button class="token" data-act="pickfield" data-for="compare">' + esc(fd.label) + icon('caret') + '</button></div>' +
      '<div class="caption">All ' + fmt(st.total) + ' ' + L.noun + (st.missing ? ' · ' + fmt(st.n) + ' with values' : '') + '</div><div class="rank">' + rankingHTML(L, S.compare, f.id) + '</div></div>';
  }
  h += '</div>';
  // inline results of simple actions

  // facts
  var facts = L.fields.filter(function(fd){ return fd.role !== 'id' && fd.role !== 'lon' && fd.role !== 'lat'; });
  var list = S.factsAll ? L.fields : facts.slice(0, 6);
  h += '<div><div class="sect-h">Facts</div><dl class="facts">' + list.map(function(fd){ var v = f.props[fd.key], st = L.stats[fd.key]; var t = (v === null || v === undefined || v === '') ? '<span class="sec">—</span>' : esc(st ? fmtVal(fd, st, v) : (typeof v === 'number' ? String(v) : v)); return '<dt title="' + esc(fd.label) + '">' + esc(fd.label) + '</dt><dd>' + t + '</dd>'; }).join('') + '</dl>' +
    '<button class="linkbtn" data-act="facts">' + (S.factsAll ? 'Show fewer fields' : 'Show all ' + L.fields.length + ' fields') + '</button></div>';
  h += actionsHTML(objectActions(L), 'object');

  return h;

function inlineHTML(f){

  }

function histogram(st){
  var bins = new Array(20).fill(0), w = 60, h = 20;
  st.vals.forEach(function(v){ var i = Math.min(19, Math.floor(20 * (v - st.min) / ((st.max - st.min) || 1))); bins[i]++; });
  var mx = Math.max.apply(null, bins), s = '<svg width="60" height="20" aria-hidden="true" style="flex:none">';
  bins.forEach(function(b, i){ var bh = b ? Math.max(1.5, h * b / mx) : 0; s += '<rect x="' + (i * 3) + '" y="' + (h - bh).toFixed(1) + '" width="2.4" height="' + bh.toFixed(1) + '" fill="var(--text-secondary)" fill-opacity=".7"/>'; });
  return s + '<line x1="0" x2="60" y1="20" y2="20" stroke="var(--border)"/></svg>';
}
function tabsHTML(){

function layerSubtitle(L){ var n = (L.records || L.features).length; return fmt(n) + ' ' + (L.kind === 'area' ? (n === 1 ? 'area' : 'areas') : (n === 1 ? 'point' : 'points')) + ' · ' + esc(L.file); }
function layerOverviewHTML(L){

    if(L.records && L.records.length !== L.features.length){ var nx = L.records.length - L.features.length; h += '<div class="notice">' + icon('warn') + '<div>' + fmt(L.records.length) + ' records opened; ' + fmt(nx) + ' have no usable location. <button class="linkbtn" style="min-height:0" data-act="review">Review ' + fmt(nx) + '</button></div></div>'; }
    h += '<div class="card" style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">' + legendHTML(L) + '<button class="btn" data-act="tab" data-tab="style">Style</button></div>';

  searchItems = [];

  loaded().forEach(function(L){ (L.records || L.features).forEach(function(f){ var texts = L.fields.filter(function(fd){ return fd.role === 'name' || fd.role === 'category'; }).slice(0, 5).map(function(fd){ return String(f.props[fd.key] || ''); }); if(texts.some(function(t){ return t.toLowerCase().indexOf(q) >= 0; })) searchItems.push({g:'Your data', t:f.name, sub:L.display + (f.located === false ? ' · no location' : ''), go:function(){ select(L.id, f.id, 'search'); var b = f.bbox; if(b) flyTo(fitTarget([b[0] - .01, b[1] - .01, b[2] + .01, b[3] + .01], {maxZ:12.5}), 700); }}); }); });
  var dataItems = searchItems.slice(0, 7);
  var placeItems = PLACES.filter(function(p){ return p[0].toLowerCase().indexOf(q) === 0; }).map(function(p){ return {g:'Places', t:p[0], sub:'City', go:function(){ flyTo({lon:p[1], lat:p[2], z:p[3]}, 800); }}; });
  searchItems = dataItems.concat(placeItems).concat([{g:'', t:'Find an action…', sub:'⌘K', go:function(){ nomock('Action search'); }}]);
  var html = '', g = null;
  if(!dataItems.length && !placeItems.length) html += '<div class="pgroup" style="font-weight:400">No places or data match “' + esc($('#q').value.trim()) + '”</div>';
  searchItems.forEach(function(it, i){ if(it.g !== g){ html += it.g ? '<div class="pgroup">' + it.g + '</div>' : '<div class="psep"></div>'; g = it.g; } html += '<button class="pitem' + (i === searchSel ? ' kb' : '') + '" data-v="' + i + '"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(it.t) + '</span><span class="r">' + esc(it.sub) + '</span></button>'; });
  openPopover($('#q'), html, function(v){ var it = searchItems[+v]; log('search pick', it.t); $('#q').value = ''; $('#q').blur(); it.go(); });
  $('#popover').style.width = $('#q').offsetWidth + 'px';
}
var searchLogT = 0;
$('#q').addEventListener('input', function(){ searchSel = 0; runSearch(); clearTimeout(searchLogT); var v = $('#q').value; searchLogT = setTimeout(function(){ if(v.trim()) log('search typed', '“' + v.trim() + '”'); }, 800); });
$('#q').addEventListener('keydown', function(e){
  if(!popState) return;
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); searchSel = (searchSel + (e.key === 'ArrowDown' ? 1 : -1) + searchItems.length) % searchItems.length; runSearch(); }
  if(e.key === 'Enter'){ e.preventDefault(); var it = searchItems[searchSel]; if(it){ closePopover(); log('search pick', it.t); $('#q').value = ''; $('#q').blur(); it.go(); } }
});

// ================================================================ keyboard (Esc ladder etc.)
document.addEventListener('keydown', function(e){
  var mod = e.metaKey || e.ctrlKey, inField = e.target.tagName === 'INPUT';
  if(e.key === 'Escape'){
    e.preventDefault();
    var step = escStep(); if(step) log('Esc', step);
    if(inField && !popState) e.target.blur();
    return;
  }
  if(e.ctrlKey && e.shiftKey && (e.key === 'L' || e.key === 'l')){ e.preventDefault(); var o = $('#observer'); o.hidden = !o.hidden; renderObserver(); return; }
  if(mod && e.key.toLowerCase() === 'f'){ e.preventDefault(); $('#q').focus(); return; }
  if(mod && e.key.toLowerCase() === 'o'){ e.preventDefault(); openDialog(); return; }
  if(mod && e.key.toLowerCase() === 'l'){ e.preventDefault(); $('#b-layers').click(); return; }
  if(mod && e.key.toLowerCase() === 'z' && !e.shiftKey && !inField){ e.preventDefault(); doUndo(); return; }
  if(mod && e.key === '0'){ e.preventDefault(); zoomToAll(); return; }
  if(inField || mod) return;
  if(e.key === '+' || e.key === '='){ zoomAround(W / 2, H / 2, 1, 250); }
  else if(e.key === '-' || e.key === '_'){ zoomAround(W / 2, H / 2, -1, 250); }
  else if(/^Arrow/.test(e.key) && (e.target === document.body || e.target.closest('#map'))){ e.preventDefault(); var d = {ArrowLeft:[1, 0], ArrowRight:[-1, 0], ArrowUp:[0, 1], ArrowDown:[0, -1]}[e.key]; var x0 = cam.lon, y0 = cam.lat, dx = d[0] * W / 4, dy = d[1] * H / 4, px = 0; animate(RM.matches ? 0 : 250, function(t){ panBy((t - px) * dx, (t - px) * dy, true); px = t; }, easeOutCubic); }
});
function escStep(){
  if(closePopover()) return 'close popover';
  if(closeDialog()) return 'close dialog';
  if(S.insp === 'object' && (S.compare || S.inline)){ S.compare = null; S.inline = null; renderInspector(); return 'close comparison / inline result'; }
  if(S.insp === 'result'){ S.result = null; S.insp = 'layer'; renderAll(); return 'close result'; }
  if(S.sel){ clearSelection(); return 'clear selection'; }
  if(S.insp){ closeInspector(); return 'close inspector'; }
  return '';
}
function renderObserver(){ var o = $('#observer'); if(o.hidden) return; o.innerHTML = '<div style="display:flex;justify-content:space-between;align-items:center"><span class="label">Observer log</span><span class="btnrow"><button class="btn" id="ob-copy">Copy</button><button class="btn" id="ob-reset">Reset session</button></span></div><div class="caption">Ctrl+Shift+L hides this. Students should not see it.</div><pre>' + esc(LOG.join('\n')) + '</pre>';
  $('#ob-copy').onclick = function(){ try { navigator.clipboard.writeText(LOG.join('\n')).then(function(){ toast('Copied'); }, function(){ toast('Copying isn’t available here.'); }); } catch(err){ toast('Copying isn’t available here.'); } };
  $('#ob-reset').onclick = function(){ location.hash = '#launch'; location.reload(); }; }

window.addEventListener('resize', function(){ W = innerWidth; H = innerHeight; renderShelf(); requestDraw(); });

// ================================================================ self-check (fixture truth vs. the mock's own computations)
function selfCheck(){
  var fails = [], n = 0;
  function ok(c, msg){ n++; if(!c) fails.push(msg); }
  var D = makeDistricts(), Pl = makeSchools();
  var save = S.layers, saveUI = [S.compare, S.inline, S.factsAll]; S.layers = [D, Pl]; D.status = Pl.status = 'ok'; S.compare = null; S.inline = null; S.factsAll = false;
  var exp = parseCSV(DATA.expected.insight_population_csv), hd = exp[0];
  exp.slice(1).forEach(function(r){ var o = {}; hd.forEach(function(h, i){ o[h] = r[i]; }); var f = D.byId[o.feature_id], st = D.stats.population;
    ok(Math.abs(st.median - Number(o.median)) < 1e-6, 'median ' + o.feature_id);
    if(o.value === '') ok(f.props.population === null, 'missing ' + o.feature_id);
    else { var ph = rankOf(st, f.props.population).phrase.replace(' with values', ''); ok(ph === o.phrase, 'phrase ' + o.feature_id + ': ' + ph + ' vs ' + o.phrase); } });
  var cnt = countsInAreas();
  parseCSV(DATA.expected.count_in_areas_csv).slice(1).forEach(function(r){ ok(cnt[r[0]] && cnt[r[0]].n === Number(r[1]), 'count ' + r[0] + ': ' + (cnt[r[0]] || {}).n + ' vs ' + r[1]); });
  ok(Pl.records.length === 248 && Pl.features.length === 242, 'schools located 242 / 248');
  var t = D.stats.july_temp_c; ok(t.n === 17 && t.vals[16] !== t.vals[15], 'hottest district is unique');
  var bad = /\b(significant|cause[sd]?|because|explains?|better|worse)\b/i;
  D.features.concat(Pl.records.slice(0, 40)).forEach(function(f){ var html = objectCardHTML(f).replace(/<[^>]+>/g, ' '); ok(!bad.test(html), 'forbidden word on ' + f.name); ok(html.indexOf('!') < 0, 'exclamation on ' + f.name); });
  S.layers = save; S.compare = saveUI[0]; S.inline = saveUI[1]; S.factsAll = saveUI[2];
  var res = fails.length ? 'FAIL ' + fails.length + '/' + n + ': ' + fails.slice(0, 5).join('; ') : 'PASS ' + n + ' checks';
  document.documentElement.setAttribute('data-selfcheck', res);
  return res;
}

// ================================================================ scripted click-through (#e2e) — drives the real UI with synthetic events
function runE2E(){
  window.__raf = 0; (function r(){ window.__raf++; requestAnimationFrame(r); })();
  var res = [], steps = [];
  function ck(c, m){ res.push((c ? 'ok ' : 'FAIL ') + m); }
  function click(sel){ var e = typeof sel === 'string' ? $(sel) : sel; if(!e) { ck(false, 'missing ' + sel); return; } e.click(); }
  function mapClick(target){ var r = target.getBoundingClientRect ? target.getBoundingClientRect() : {left:W/2, top:H/2, width:0, height:0}; var x = r.left + r.width / 2, y = r.top + r.height / 2;
    ['pointerdown', 'pointerup'].forEach(function(t){ target.dispatchEvent(new PointerEvent(t, {bubbles:true, button:0, clientX:x, clientY:y, pointerId:1})); }); }
  function esc_(){ document.dispatchEvent(new KeyboardEvent('keydown', {key:'Escape', bubbles:true})); }
  function insp(){ return $('#inspector').hidden ? '' : $('#inspector').textContent; }
  steps.push(function(){ ck(!$('#welcome').hidden && /Open a file to see your data on the map\./.test($('#welcome').textContent), 'welcome card'); click('#w-example'); });
  steps.push(function(){ ck(/Reading [\d.]+ of [\d.]+ KB/.test($('#shelf').textContent), 'importing progress text'); });
  steps.push(function(){ ck(loaded().length === 2, 'two layers loaded'); ck(!!$('#shelf .adot'), 'schools assumption dot'); ck($('#welcome').hidden, 'welcome gone'); });
  steps.push(function(){ mapClick($('path[data-id="D11"]')); });
  steps.push(function(){ var t = insp(); ck(/徐汇区 Xuhui/.test(t) && /Districts · area · 237\.93 km²/.test(t), 'object card header'); ck(/What's inside\?/.test(t) && /Compare with other Districts/.test(t) && /Measure its area/.test(t), 'row 7 actions');    click('#inspector [data-act=compare]'); });
  steps.push(function(){ if(drawPending) drawNow(); /* headless Chrome may not produce animation frames */ ck($$('#g-sel path').length === 2, 'selection outline + halo'); ck(S.compare === 'population', 'compare defaults to first insight field'); click('#inspector [data-act=pickfield]'); });
  steps.push(function(){ ck(!$('#popover').hidden, 'field popover open'); click('#popover [data-v=july_temp_c]'); });
  steps.push(function(){ var first = $('#inspector .crow'); ck(first && first.getAttribute('data-id') === 'D17' && /35\.8 °C/.test(first.textContent), 'hottest = Huangpu 35.8 °C at the top'); click('#inspector [data-act=more]'); });
  steps.push(function(){ ck(!$('#popover').hidden, 'more actions open'); esc_(); ck($('#popover').hidden && !!S.compare, 'Esc 1 closes popover only'); esc_(); ck(!S.compare && !!S.sel, 'Esc 2 closes comparison'); esc_(); ck(!S.sel && S.insp === 'layer' && /17 areas · districts\.geojson/.test(insp()), 'Esc 3 clears selection, overview stays'); esc_(); ck(!S.insp, 'Esc 4 closes inspector'); });
  steps.push(function(){ click($('#shelf .lrow[data-layer=schools]')); });
  steps.push(function(){ var t = insp(); ck(/248 points · schools\.csv/.test(t) && /Located using lon and lat as GPS coordinates \(WGS 84\)\. Change/.test(t), 'schools overview + assumption'); ck(/248 records opened; 6 have no usable location\./.test(t), 'partial import copy'); ck(/Count Schools in each District/.test(t), 'row 5 actions'); mapClick($('circle[data-id="1"]')); });
  steps.push(function(){ ck(/Which District is it in\?/.test(insp()), 'row 3 point actions'); click('#inspector [data-act=which]'); });
  steps.push(function(){ ck(/In 闸北区 Zhabei/.test(insp()), 'point-in-district'); mapClick($('#mapsvg')); });
  steps.push(function(){ ck(!S.sel && S.insp === 'layer', 'empty-map click clears selection'); click($('#shelf .lrow[data-layer=districts]')); });
  steps.push(function(){ click('#inspector [data-act=color]'); });
  steps.push(function(){ click('#popover [data-v=july_temp_c]'); });
  steps.push(function(){ var D = layer('districts'); ck(D.style.mode === 'value' && D.style.palette === 'heat', 'color by temperature uses Heat'); ck(/No data/.test(insp()) && /28\.9 °C/.test(insp()), 'legend with units + No data'); ck(!$('#b-undo').disabled, 'undo enabled'); click('#b-undo'); });
  steps.push(function(){ ck(layer('districts').style.mode === 'single', 'undo restores style'); click('#inspector [data-act=count]'); });
  steps.push(function(){ ck(/Schools in each district/.test(insp()) && /6 schools have no location/.test(insp()), 'count result card'); });
  var i = 0;
  (function next(){ if(i < steps.length){ try { steps[i++](); } catch(err){ ck(false, 'step ' + i + ' threw ' + err.message); } setTimeout(next, i === 2 ? 2200 : 120); }
    else { var f = res.filter(function(r){ return r.indexOf('FAIL') === 0; }); document.documentElement.setAttribute('data-e2e', (f.length ? 'FAIL ' : 'PASS ') + res.length + ' | ' + res.join(' ; ')); document.title = 'E2E ' + (f.length ? 'FAIL ' + f.join(' ; ') : 'PASS ' + res.length + ' checks') + (ERRORS.length ? ' | JSERROR ' + ERRORS.join(' | ') : ''); } })();
}

// ================================================================ hash states (for testing and screenshots)
function applyHash(){
  var h = location.hash.replace(/^#/, ''), o = {};
  h.split('&').forEach(function(kv){ if(!kv) return; var p = kv.split('='); o[decodeURIComponent(p[0])] = p.length > 1 ? decodeURIComponent(p[1]) : true; });
  if(o.dark) setTheme('dark');
  var want = !h || o.launch || o.e2e ? 'launch' : 'loaded';
  if(o.importing){
    S.welcome = false; S.layers = [makeDistricts(), makeSchools()]; S.layers[0].progress = .62; S.layers[1].progress = .28; S.phase = 'importing';
    renderAll(); return o;
  }
  if(want === 'launch'){ renderAll(); return o; }
  startImport([0, 1], true);
  var D = layer('districts');
  if(o.color && D.fieldBy[o.color]){ D.style = {mode:'value', field:o.color, palette:palettesFor(D.fieldBy[o.color])[0]}; buildData(); }
  if(o.layer){ S.active = o.layer; S.insp = 'layer'; S.tab = o.tab || 'overview'; }
  if(o.district){ S.sel = {layer:'districts', id:o.district}; S.active = 'districts'; S.insp = 'object'; if(o.compare) S.compare = o.compare; if(o.inline) S.inline = o.inline; }
  if(o.school){ S.sel = {layer:'schools', id:String(o.school)}; S.active = 'schools'; S.insp = 'object'; if(o.inline) S.inline = o.inline; }
  if(o.count){ S.active = 'districts'; S.insp = 'result'; S.result = {type:'count', showAll:o.count === 'all'}; }
  if(o.rank){ S.active = 'districts'; S.insp = 'result'; S.result = {type:'rank', field:o.rank, showAll:!!o.all}; }
  var t = fitTarget(D.bbox, {r:S.insp ? 396 : 60}); cam.lon = t.lon; cam.lat = t.lat; cam.z = t.z;
  renderAll();
  if(o.popover === 'more'){ var b = $('#inspector [data-act=more]'); if(b) b.click(); }
  if(o.popover === 'color'){ var c = $('#inspector [data-act=color]'); if(c) c.click(); }
  if(o.observer){ $('#observer').hidden = false; renderObserver(); }
  return o;
}

// ================================================================ boot
buildBase(); renderToolbar();
var opts = applyHash();
drawNow();
var sc = selfCheck();
if(opts.e2e) runE2E();
BOOT = false;
requestAnimationFrame(function(){ requestAnimationFrame(function(){ document.documentElement.classList.remove('boot'); }); });
if(opts.selftest) document.title = 'SELFTEST ' + sc + (ERRORS.length ? ' | JSERROR ' + ERRORS.join(' | ') : '');
log('session start', location.hash || '#launch');
window.addEventListener('hashchange', function(){ location.reload(); });
})();
