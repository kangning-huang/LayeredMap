# Supabase project settings the CLI deploys with (only what NimbleMap needs; `supabase init` would
# write the full file). project_id is the local name; link the real project with
# `supabase link --project-ref <ref>`.
project_id = "nimblemap"

[auth]
# The app's loopback redirect (docs/lm/accounts-design.md › The redirect). The hosted project's
# Redirect URLs list (Authentication › URL Configuration) needs the same entry.
site_url = "http://127.0.0.1"
additional_redirect_urls = ["http://127.0.0.1:*/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

# Both functions check the token themselves (auth.getClaims), which works with the legacy JWT secret
# and with the newer asymmetric signing keys; the gateway check is left off so either works.
[functions.ask]
verify_jwt = false

[functions.account]
verify_jwt = false
