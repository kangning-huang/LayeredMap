# cargo-about (Gate 5 license audit): the licences of every crate built into the NimbleMap app.
# `cargo xtask licenses` renders packaging/lm/about.hbs into ATTRIBUTION-crates.md; the asset,
# data and font sources stay in the hand-written ATTRIBUTION.md. The allowed list matches
# deny.toml's.
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "CDLA-Permissive-2.0",
  "OFL-1.1",
  "Ubuntu-font-1.0",
  "MPL-2.0",
]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
# Crates whose packaged licence files need help to be identified.
workarounds = ["ring", "rustls"]
