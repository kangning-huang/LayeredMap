[package]
name = "layeredmap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LayeredMap desktop app: window, menu bar, file associations, packaging"

# The workspace forbids unsafe code. The app alone relaxes that to `deny`, so its macOS module
# (Open With, Dock drops, the Edited state) can opt in with `#[allow(unsafe_code)]`, a SAFETY
# comment on every block, and a second review (Architecture › Rules enforced in CI).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
lm-ui = { path = "../../crates/lm-ui" }
lm-core = { path = "../../crates/lm-core" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
rfd = { workspace = true }
muda = { version = "0.21", default-features = false }
egui = { workspace = true }
log = { workspace = true }

# The macOS module (Open With, Dock drops): the same objc2 versions winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = ["block2", "NSArray", "NSEnumerator", "NSNotification", "NSOperation", "NSString", "NSURL", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder"] }
