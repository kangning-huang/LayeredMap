[package]
name = "layeredmap"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NimbleMap desktop app: window, menu bar, file associations, packaging"

# The workspace forbids unsafe code. The app alone relaxes that to `deny`, so its macOS module
# (Open With, Dock drops, the Edited state) and Windows module (the menu bar) can opt in with `#[allow(unsafe_code)]`, a SAFETY
# comment on every block, and a second review (Architecture › Rules enforced in CI).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
too_many_arguments = "allow"
type_complexity = "allow"

[dependencies]
lm-ui = { path = "../../crates/lm-ui" }
lm-core = { path = "../../crates/lm-core" }
lm-net = { path = "../../crates/lm-net" }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "persistence"] }
rfd = { workspace = true }
muda = { version = "0.21", default-features = false }
# The system's preferred languages, for the interface language (WP5.5); upstream's UI uses it too.
sys-locale = "0.3"
egui = { workspace = true }
# `std`: the diagnostics module installs a boxed logger.
log = { workspace = true, features = ["std"] }

[features]
# The update dry run only (docs/lm/update-feed.md › Dry run); bundle-macos.sh refuses it for a
# release version.
update-test-hook = ["lm-ui/update-test-hook"]

# The macOS module (Open With, Dock drops, the Edited state): the same objc2 versions winit already uses.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
block2 = "0.5.1"
objc2-foundation = { version = "0.2.2", features = ["block2", "NSArray", "NSEnumerator", "NSNotification", "NSOperation", "NSString", "NSURL", "NSThread"] }
objc2-app-kit = { version = "0.2.2", features = ["NSApplication", "NSResponder", "NSWindow"] }

# The Windows module (the menu bar on the window) and the system version for crash logs.
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
winreg = "0.56"

# The Windows executable's icon, version information and manifest (DPI awareness, long paths):
# build.rs compiles packaging/lm/windows/layeredmap.rc when the target is Windows.
[build-dependencies]
embed-resource = "3"
