<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <title>NimbleMap — open map data in your browser</title>
  <meta name="description" content="NimbleMap (凌波微图) in your browser: open GeoJSON, CSV, Shapefile, GeoPackage, GeoTIFF and NetCDF files on a map. Your files never leave your computer.">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#f4f1ea">
  <link rel="modulepreload" href="__JS__">
  <link rel="preload" href="__WASM__" as="fetch" type="application/wasm" crossorigin>
  <style>
    :root { --bg: #f4f1ea; --fg: #4a5563; --pill: rgba(255, 255, 255, 0.86); --pill-fg: #374151; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d2129; --fg: #aab2bf; --pill: rgba(36, 40, 48, 0.86); --pill-fg: #d1d5db; } }
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: var(--bg); }
    #nimblemap_canvas { position: absolute; top: env(safe-area-inset-top, 0px); left: env(safe-area-inset-left, 0px);
      width: calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
      height: calc(100% - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display: block; outline: none; }
    #nimblemap_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; color: var(--fg); font: 14px system-ui, -apple-system, "Segoe UI", sans-serif; pointer-events: none; text-align: center; padding: 0 16px; }
    #nimblemap_loading img { width: 88px; height: 88px; animation: pulse 1.6s ease-in-out infinite; }
    #nimblemap_loading .bar { width: 180px; height: 3px; border-radius: 2px; background: rgba(127, 127, 127, 0.25); overflow: hidden; }
    #nimblemap_loading .bar i { display: block; height: 100%; width: 0; background: #e4783d; transition: width 0.2s; }
    @keyframes pulse { 50% { transform: scale(0.94); opacity: 0.8; } }
    #nimblemap_note { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(44px + env(safe-area-inset-bottom, 0px));
      padding: 4px 8px 4px 10px; border-radius: 8px; max-width: 250px; line-height: 1.35; background: var(--pill); color: var(--pill-fg); z-index: 5;
      font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; white-space: normal; pointer-events: auto;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); display: flex; align-items: center; gap: 6px; transition: opacity 0.4s; }
    #nimblemap_note button { all: unset; cursor: pointer; opacity: 0.6; padding: 0 2px; }
    #nimblemap_note[hidden] { display: none; }
    @media (max-width: 700px) { #nimblemap_note { display: none; } }
  </style>
</head>
<body>
  <canvas id="nimblemap_canvas"></canvas>
  <div id="nimblemap_loading">
    <img src="logo.svg" alt="">
    <div>Loading NimbleMap&hellip;</div>
    <div class="bar"><i id="nimblemap_progress"></i></div>
    <div style="font-size:12px;opacity:.75">Preview · runs entirely in your browser; your files never leave your computer</div>
  </div>
  <div id="nimblemap_note" hidden>
    <span>Preview · runs entirely in your browser; your files never leave your computer</span>
    <button type="button" aria-label="Dismiss" title="Dismiss">&times;</button>
  </div>
  <script type="module">
    import init from "./__JS__";
    // Download the WebAssembly with a progress bar, then start the app.
    const bar = document.getElementById("nimblemap_progress");
    async function load(url) {
      const resp = await fetch(url);
      const total = +resp.headers.get("content-length") || 0;
      if (!resp.body || !total) return resp;
      let got = 0;
      const reader = resp.body.getReader();
      const stream = new ReadableStream({
        async pull(ctl) {
          const { done, value } = await reader.read();
          if (done) { ctl.close(); return; }
          got += value.length; bar.style.width = Math.min(100, (100 * got) / total) + "%";
          ctl.enqueue(value);
        },
      });
      return new Response(stream, { headers: { "content-type": "application/wasm" } });
    }
    window.__nimblemap_t0 = performance.now();
    init({ module_or_path: load("./__WASM__") }).then((w) => { window.__nimblemap_wasm = w; }).catch((e) => {
      document.getElementById("nimblemap_loading").innerHTML =
        "<p>NimbleMap couldn't start: " + String(e).replace(/[<>&]/g, "") + "</p><p>It needs a recent Chrome, Edge, Firefox or Safari.</p>";
    });
    const note = document.getElementById("nimblemap_note");
    let dismissed = false;
    try { dismissed = localStorage.getItem("lm.web.note") === "off"; } catch (e) {}
    if (!dismissed) note.hidden = false;
    // It steps aside after a while; the loading screen said it first.
    setTimeout(() => { note.style.opacity = "0"; setTimeout(() => { note.hidden = true; }, 500); }, 30000);
    note.querySelector("button").onclick = () => { note.hidden = true; try { localStorage.setItem("lm.web.note", "off"); } catch (e) {} };
  </script>
</body>
</html>
