[package]
name = "lm-jobs"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NimbleMap: plans, previews, background jobs, atomic commit"

[lints]
workspace = true

[dependencies]
lm-core = { path = "../lm-core" }
lm-profile = { path = "../lm-profile" }
lm-analysis = { path = "../lm-analysis" }
lm-net = { path = "../lm-net" }
rustgis-engine = { workspace = true }
rustgis-analysis = { workspace = true }
log = { workspace = true }
encoding_rs = { workspace = true }
csv = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tiff = { workspace = true }
# KML, KMZ and GPX (import::kml, import::gpx).
roxmltree = { workspace = true }
# The data library's checksums (WP5.4).
sha2 = { workspace = true }
# NetCDF grids (import::netcdf, WP6.12): pure Rust, MIT OR Apache-2.0.
netcdf-reader = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Settling a copy of a GeoPackage whose changes are still in its -wal or -journal (import::gpkg).
rusqlite = { workspace = true }
# The data library's downloads (WP5.4). Already in the build through rustgis-tiles.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
