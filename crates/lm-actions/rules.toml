# NimbleMap action rules (Insight cards and suggested actions › Selection → suggested actions).
#
# The table in the spec is the specification; this file is that table as data. Changing an
# order is a one-line edit here plus the matching snapshot in tests/rows.rs.
#
# Selection keys (what is selected):
#   empty          nothing selected, no data open          nothing       nothing selected, data open
#   one_point      one object of a point layer             point_layer   a whole point layer
#   one_line       one object of a line layer              line_layer    a whole line layer
#   one_area       one object of an area layer             area_layer    a whole area layer
#   raster_pixel   one raster cell                         raster_layer  a whole raster layer
#   table          a table without locations (or one row)  drawn_area    an area the user drew
#   several        several objects of one layer
#
# Label tokens, filled when an action is suggested:
#   [layer]   the selected layer's name             [other]   the companion layer's name
#   [Schools] the point layer in play, [School] its singular; likewise [Districts] / [District]
#   for the area layer and [Lines] / [Line] for the line layer. [Heat] is the raster in play.
#   [Type] / [field] the field the action works on   [code] the shared code column
#
# Companion kinds: points, lines, areas, raster, any (any visible layer with locations), vector
# (any visible point, line or area layer),
# shared_code (a visible layer with an identifier column of the same name as the table's; unused
# since match_table picks its columns).
#
# more_only = true: offered under More actions and to the assistant, never in a row's top three.
#
# surface: "card" actions are display-only and shown as suggested-action buttons in the free
# app; "assistant" actions are analysis: never buttons in either tier (Product tiers), only shown
# behind the developer flag, and called by Pro's assistant.
#
# Requirement kinds (`need`): measure_field (a number field whose role is Measure, at Certain or
# Likely confidence), style_field (such a measure field, or a Category field), category_field,
# coordinate_fields (two columns whose role is Coordinate).

# ---------------------------------------------------------------- Getting started

[[action]]
id = "open_file"
label = "Open file"
aliases = ["import", "load", "add data", "add layer"]
group = "Understand"
min_phase = 2
surface = "card"
inputs = ["empty"]
input_reason = "Open files from the File menu or by dropping them on the map."

[[action]]
id = "try_example"
label = "Try an example"
aliases = ["sample data", "demo", "example data"]
group = "Understand"
min_phase = 2
surface = "card"
inputs = ["empty"]
input_reason = "Examples are offered when no data is open."

[[action]]
id = "browse_library"
label = "Browse data library"
aliases = ["catalog", "download data", "open data"]
group = "Understand"
min_phase = 5
surface = "card"
inputs = ["empty"]
input_reason = "Browse the data library from the File menu."

# ---------------------------------------------------------------- Display-only (Phase 3)

[[action]]
id = "style_by_value"
label = "Color by a value"
aliases = ["choropleth", "symbology", "graduated colors", "classify", "style"]
group = "Change look"
min_phase = 3
surface = "card"
inputs = ["point_layer", "line_layer", "one_line", "area_layer"]
input_reason = "Select a layer on the shelf to color it by a value."
requires = [
    { need = "style_field", reason = "[layer] has no number or category field to color by. Set a field's role in Details." },
]

[[action.variant]]
on = ["point_layer"]
label = "Color or size by a value"

[[action]]
id = "filter"
label = "Filter [layer]"
aliases = ["query", "where", "subset", "definition query"]
group = "Change look"
min_phase = 3
surface = "card"
inputs = ["one_point", "one_line", "one_area", "point_layer", "line_layer", "area_layer"]
input_reason = "Select a layer or an object to filter."
requires = [
    { need = "style_field", reason = "[layer] has no number or category field to filter by. Set a field's role in Details." },
]

[[action.variant]]
on = ["one_point", "one_line", "one_area"]
label = "Filter by [Type]"
requires = [
    { need = "category_field", reason = "[layer] has no category field to filter by. Set a field's role to Category in Details." },
]

[[action]]
id = "compare_peers"
label = "Compare with other [layer]"
aliases = ["rank chart", "ranking", "distribution"]
group = "Compare"
min_phase = 3
surface = "card"
inputs = ["one_area", "one_point", "one_line"]
input_reason = "Click one object on the map to compare it with the others."
requires = [
    { need = "measure_field", reason = "[layer] has no number field to compare. Mark a field as a measure in Details." },
]

[[action]]
id = "raster_colors"
label = "Change colors and range"
aliases = ["stretch", "color ramp", "palette", "symbology"]
group = "Change look"
min_phase = 3
surface = "card"
inputs = ["raster_layer", "raster_pixel"]
input_reason = "Select a raster layer to change its colors."

[[action.variant]]
on = ["raster_pixel"]
label = "Change colors"

[[action]]
id = "threshold"
label = "Show only values above…"
aliases = ["threshold", "mask", "cutoff"]
group = "Change look"
min_phase = 3
surface = "card"
inputs = ["raster_layer", "raster_pixel"]
input_reason = "Select a raster layer to show only some of its values."

[[action]]
id = "similar_values"
label = "Show where values are like this"
aliases = ["similar cells", "value range", "highlight"]
group = "Understand"
min_phase = 3
surface = "card"
inputs = ["raster_pixel"]
input_reason = "Click a cell on a raster layer first."

# ---------------------------------------------------------------- Tables (display)

[[action]]
id = "view_data"
label = "View data"
aliases = ["attribute table", "table", "rows"]
group = "Understand"
min_phase = 3
surface = "card"
inputs = ["table", "point_layer", "line_layer", "area_layer"]
input_reason = "Select a layer or a table to view its rows."

[[action]]
id = "map_coordinates"
label = "Map using coordinate columns"
aliases = ["xy to points", "lat lon", "geocode columns"]
group = "Keep"
min_phase = 4
surface = "card"
inputs = ["table"]
input_reason = "Select a table without locations."
requires = [
    { need = "coordinate_fields", reason = "This table has no longitude and latitude columns. Mark two columns as coordinates in Details." },
]

# Joining a table is Free (WP3.11: it creates no geometry), so this is a card action; it opens
# the column picker. The assistant calls the same runner (lm_jobs::actions, `match_table`).
[[action]]
id = "match_table"
label = "Match to [other]"
aliases = ["join", "table join", "attribute join", "merge", "vlookup", "match by code"]
group = "Keep"
min_phase = 3
surface = "card"
inputs = ["table"]
input_reason = "Select a table without locations."
companion = { kind = "vector", reason = "Open a point, line or area layer to match this table to." }
algorithm = "join::apply"
method = "an attribute join: each table row goes to every record whose key matches (exactly, or loosened as the join's ladder says); a record matching several rows takes the latest by a year or date column, otherwise counts summed and other numbers averaged; blank keys never match"

# ---------------------------------------------------------------- Analysis (Phase 4, assistant)

[[action]]
id = "buffer"
label = "Show an area within a distance"
aliases = ["buffer", "radius", "distance zone"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "new_layer"
algorithm = "buffer::buffer"
method = "Straight-line distance: a geodesic buffer on the WGS 84 ellipsoid"
decisions = ["distance, in meters or kilometers", "merge overlapping areas (the default) or keep one area for each feature"]
inputs = ["one_point", "one_line", "line_layer", "point_layer"]
input_reason = "Select a point or a line, or a point or line layer."

[[action.variant]]
on = ["point_layer"]
label = "Show an area within a distance of each"

[[action]]
id = "measure_from_here"
label = "Measure from here"
aliases = ["distance", "ruler", "nearest"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "geodesic::distance"
method = "geodesic distance on the WGS 84 ellipsoid"
decisions = ["the point or feature to measure to"]
inputs = ["one_point"]
input_reason = "Click one point on the map first."

[[action]]
id = "which_container"
label = "Which [District] is it in?"
aliases = ["point in polygon", "spatial join", "locate"]
group = "Understand"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "overlay::which_area"
method = "point in area; a point on a boundary lists every area it touches"
inputs = ["one_point"]
input_reason = "Click one point on the map first."
companion = { kind = "areas", reason = "Add an area layer to see which area this point is in." }

[[action]]
id = "count_in"
label = "Count [Schools] in each [District]"
aliases = ["points in polygon", "count points", "spatial join"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "new_layer"
algorithm = "overlay::count_in_areas"
method = "point-in-area count; a point on a boundary counts in every area it touches; areas with no points stay, with 0"
decisions = ["which points: all, or those the filter shows", "which areas"]
inputs = ["point_layer", "area_layer"]
input_reason = "Select a point layer or an area layer."
companion = { kind = "areas", reason = "Add an area layer to count [layer] in each area." }

[[action.variant]]
on = ["area_layer"]
companion = { kind = "points", reason = "Add a point layer to count points in each of [layer]." }

[[action]]
id = "add_raster_values"
label = "Add [Heat] values to each [School]"
aliases = ["extract values", "sample raster", "point sampling"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "new_fields"
algorithm = "zonal::sample"
method = "the value of the raster cell containing each point, with scale and offset applied; no interpolation; no data stays blank"
decisions = ["which band"]
inputs = ["point_layer"]
input_reason = "Select a point layer."
companion = { kind = "raster", reason = "Add a raster layer to read its values at each of [layer]." }

[[action]]
id = "measure_area"
label = "Measure its area"
aliases = ["area", "size", "km2"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "geodesic::area"
method = "geodesic area on the WGS 84 ellipsoid"
inputs = ["one_area", "drawn_area"]
input_reason = "Click one area on the map, or draw one."

[[action]]
id = "whats_inside"
label = "What's inside?"
aliases = ["points in polygon", "select by location", "within"]
group = "Understand"
min_phase = 4
surface = "assistant"
output = "filtered_view"
algorithm = "overlay::whats_inside"
method = "everything that touches or lies inside the area"
decisions = ["which layer to look in"]
inputs = ["one_area"]
input_reason = "Click one area on the map first."
companion = { kind = "points", reason = "Add a point layer to see what is inside this area." }

[[action]]
id = "summarize_here"
label = "Summarize [Heat] here"
aliases = ["zonal statistics", "mean value", "raster statistics"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "zonal::summarize"
method = "area-weighted mean with fractional cell coverage, each cell weighted by its area on the ellipsoid"
decisions = ["which band"]
inputs = ["one_area"]
input_reason = "Click one area on the map first."
companion = { kind = "raster", reason = "Add a raster layer to summarize its values in this area." }

[[action]]
id = "summarize_over_time"
label = "[Heat] over time here"
more_only = true
aliases = ["time series", "hottest day", "each day", "over time"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "zonal::summarize"
method = "the area-weighted mean (or the cell under a point) on every time step, ranked highest first"
decisions = ["which band"]
inputs = ["one_area", "one_point"]
input_reason = "Click one area or point on the map first."
companion = { kind = "raster", reason = "Add a file with a time slider (NetCDF) to see its values over time here." }

[[action]]
id = "summarize_each"
label = "Summarize [Heat] in each [District]"
aliases = ["zonal statistics", "zonal stats", "raster by polygon"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "new_layer"
algorithm = "zonal::summarize"
method = "area-weighted mean, minimum and maximum with fractional cell coverage, each cell weighted by its area on the ellipsoid; coverage reported"
decisions = ["which band", "which areas"]
inputs = ["area_layer", "raster_layer"]
input_reason = "Select an area layer or a raster layer."
companion = { kind = "raster", reason = "Add a raster layer to summarize it in each of [layer]." }

[[action.variant]]
on = ["raster_layer"]
companion = { kind = "areas", reason = "Add an area layer to summarize [layer] in each area." }

[[action]]
id = "rank_by_value"
label = "Rank [layer] by a value"
aliases = ["sort", "top ten", "ranking"]
group = "Compare"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "insight::rank"
method = "a sort by the value; ties share a rank"
decisions = ["which value"]
inputs = ["area_layer", "point_layer", "line_layer"]
input_reason = "Select a layer on the shelf to rank its objects."
requires = [
    { need = "measure_field", reason = "[layer] has no number field to rank by. Mark a field as a measure in Details." },
]

[[action]]
id = "measure_length"
label = "Measure length"
aliases = ["length", "distance", "km"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "geodesic::length"
method = "geodesic length on the WGS 84 ellipsoid"
inputs = ["one_line", "line_layer"]
input_reason = "Select a line or a line layer."

[[action]]
id = "summarize_drawn"
label = "Summarize in an area I draw"
aliases = ["zonal statistics", "draw polygon", "custom area"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "zonal::summarize"
method = "area-weighted mean with fractional cell coverage inside the drawn area"
decisions = ["the area to draw", "which band"]
inputs = ["raster_pixel", "raster_layer"]
input_reason = "Select a raster layer first."

[[action]]
id = "summarize_data_here"
label = "Summarize data here"
aliases = ["clip", "statistics in area", "summary"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "overlay::whats_inside"
method = "the count, total geodesic area or length, and number-field totals of what touches or lies inside the area"
decisions = ["which layer to summarize"]
inputs = ["drawn_area"]
input_reason = "Draw an area on the map first."
companion = { kind = "any", reason = "Show a layer with data on the map to summarize it in this area." }

[[action]]
id = "count_here"
label = "Count [Schools] here"
aliases = ["count points", "points in polygon"]
group = "Measure"
min_phase = 4
surface = "assistant"
output = "card"
algorithm = "overlay::count_in_areas"
method = "point-in-area count; a point on the boundary counts"
decisions = ["which points"]
inputs = ["drawn_area"]
input_reason = "Draw an area on the map first."
companion = { kind = "points", reason = "Add a point layer to count its points in this area." }

# ---------------------------------------------------------------- Analysis added for the puzzles
# (docs/lm/puzzles/mechanics.md §3, owner's go-ahead 2026-10-17)

[[action]]
id = "nearest_distance"
label = "Add the distance to the nearest of [other] to [layer]"
aliases = ["near", "proximity", "distance to nearest", "how far", "away from"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_fields"
algorithm = "nearest::nearest_distance"
method = "the shortest geodesic distance on the WGS 84 ellipsoid from each feature to any feature of the other layer (0 where they touch), with the other layer's edges followed at least every kilometre"
decisions = ["the layer to measure to"]
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."
companion = { kind = "vector", reason = "Add a point, line or area layer to measure the distance to." }

[[action]]
id = "nearest_other"
label = "Add the distance to the nearest neighbour in [layer]"
aliases = ["isolation", "nearest neighbour", "most remote"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_fields"
algorithm = "nearest::nearest_distance"
method = "the shortest geodesic distance on the WGS 84 ellipsoid from each feature to any other feature of the same layer; a feature's own parts don't count"
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."

[[action]]
id = "join_by_location"
label = "Add [other] details to [layer]"
aliases = ["spatial join", "attributes by location", "which area"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_fields"
algorithm = "overlay::join_by_location"
method = "each feature takes the details of the area that contains it (lines and areas by a point on them); a point on a shared boundary takes the first area; a point in no area gets blanks"
decisions = ["which details to add"]
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."
companion = { kind = "areas", reason = "Add an area layer whose details to add." }

[[action]]
id = "add_measurements"
label = "Add area and coordinates to [layer]"
aliases = ["calculate geometry", "area field", "coordinates", "centroid", "xy"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_fields"
algorithm = "measure::measurements"
method = "geodesic area, perimeter and length on the WGS 84 ellipsoid; coordinates of each point, or of a point guaranteed to lie on each line or area"
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."

[[action]]
id = "calculate_field"
label = "Add a field calculated from two values"
aliases = ["field calculator", "difference", "ratio", "compute column"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_fields"
algorithm = "fields::calculate"
method = "a new number from two number fields, or a field and a number: added, subtracted, multiplied or divided; a blank input or a division by zero gives a blank, never 0"
decisions = ["the two values", "the operation"]
inputs = ["point_layer", "line_layer", "area_layer", "table"]
input_reason = "Select a layer or a table."

[[action]]
id = "split_parts"
label = "Split [layer] into separate parts"
aliases = ["explode", "multipart to singlepart", "separate islands"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_layer"
algorithm = "topology::explode"
method = "one feature for each separate part of a multi-part line or area (holes stay with their part), its details copied, with a part number"
inputs = ["line_layer", "area_layer"]
input_reason = "Select a line or area layer."

[[action]]
id = "keep_inside"
label = "Keep the part of [layer] inside [other]"
aliases = ["clip", "intersect", "cut to"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_layer"
algorithm = "clip::keep_inside"
method = "the part of each feature inside the other layer's areas (edges straight in longitude and latitude, as the map draws them); points on the boundary are kept; features left empty are dropped and counted"
decisions = ["which areas to keep inside"]
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."
companion = { kind = "areas", reason = "Add an area layer to keep [layer] inside." }

[[action]]
id = "remove_inside"
label = "Remove the part of [layer] inside [other]"
aliases = ["erase", "difference", "away from", "outside"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_layer"
algorithm = "clip::remove_inside"
method = "the part of each feature outside the other layer's areas (edges straight in longitude and latitude); points on the boundary are removed; features left empty are dropped and counted"
decisions = ["which areas to remove"]
inputs = ["point_layer", "line_layer", "area_layer"]
input_reason = "Select a point, line or area layer."
companion = { kind = "areas", reason = "Add an area layer to remove from [layer]." }

[[action]]
id = "find_where"
label = "Find areas where [Heat] meets conditions"
aliases = ["raster calculator", "map algebra", "suitability", "reclassify", "multi-criteria", "where"]
group = "Measure"
min_phase = 4
surface = "assistant"
more_only = true
output = "new_layer"
algorithm = "where_areas::find_where"
method = "cells of the first raster's grid where every condition holds (other rasters read at each cell's centre; no data anywhere leaves a cell out), joined into areas where cells touch, edges following the cells; areas measured on the WGS 84 ellipsoid"
decisions = ["the conditions on each raster"]
inputs = ["raster_layer"]
input_reason = "Select a raster layer."

# ---------------------------------------------------------------- The table, in order
# `other` is the spec's "Other open layer" column: none, any, points, lines, areas or raster.
# A row naming a kind matches when a visible layer of that kind can be the companion; a "none"
# row matches only when no row naming a kind matched; "any" always matches.

[[row]]
n = 1
selected = ["empty"]
other = "none"
actions = ["open_file", "try_example", "browse_library"]

[[row]]
n = 2
selected = ["one_point"]
other = "none"
actions = ["buffer", "measure_from_here", "filter"]

[[row]]
n = 3
selected = ["one_point"]
other = "areas"
actions = ["which_container", "buffer", "measure_from_here"]

[[row]]
n = 4
selected = ["point_layer"]
other = "none"
actions = ["style_by_value", "filter", "buffer"]

[[row]]
n = 5
selected = ["point_layer"]
other = "areas"
actions = ["count_in", "style_by_value", "filter"]

[[row]]
n = 6
selected = ["one_area"]
other = "none"
actions = ["compare_peers", "measure_area", "filter"]

[[row]]
n = 7
selected = ["one_area"]
other = "points"
actions = ["whats_inside", "compare_peers", "measure_area"]

[[row]]
n = 8
selected = ["one_area"]
other = "raster"
actions = ["summarize_here", "compare_peers", "measure_area"]

[[row]]
n = 9
selected = ["area_layer"]
other = "raster"
actions = ["summarize_each", "style_by_value", "rank_by_value"]

[[row]]
n = 10
selected = ["area_layer"]
other = "points"
actions = ["count_in", "style_by_value", "rank_by_value"]

[[row]]
n = 11
selected = ["area_layer"]
other = "none"
actions = ["style_by_value", "rank_by_value", "filter"]

[[row]]
n = 12
selected = ["one_line", "line_layer"]
other = "any"
actions = ["measure_length", "style_by_value", "buffer"]

[[row]]
n = 13
selected = ["raster_pixel"]
other = "any"
actions = ["similar_values", "raster_colors", "summarize_drawn"]

[[row]]
n = 14
selected = ["raster_layer"]
other = "areas"
actions = ["summarize_each", "raster_colors", "threshold"]

[[row]]
n = 15
selected = ["raster_layer"]
other = "none"
actions = ["raster_colors", "threshold", "summarize_drawn"]

# match_table needs a point, line or area layer to match to (its companion), so the row still
# offers its other two actions when none is open.
[[row]]
n = 16
selected = ["table"]
other = "any"
actions = ["match_table", "map_coordinates", "view_data"]

[[row]]
n = 17
selected = ["drawn_area"]
other = "any"
actions = ["summarize_data_here", "count_here", "measure_area"]

[[row]]
n = 18
selected = ["point_layer"]
other = "raster"
actions = ["add_raster_values", "style_by_value", "filter"]
