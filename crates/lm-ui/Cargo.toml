[package]
name = "lm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NimbleMap: the map-first shell"

[lints]
workspace = true

[dependencies]
lm-core = { path = "../lm-core" }
lm-actions = { path = "../lm-actions" }
lm-jobs = { path = "../lm-jobs" }
lm-doc = { path = "../lm-doc" }
lm-mapview = { path = "../lm-mapview" }
lm-ask = { path = "../lm-ask" }
lm-account = { path = "../lm-account" }
lm-net = { path = "../lm-net" }
serde_json = { workspace = true }
egui = { workspace = true }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
log = { workspace = true }
image = { workspace = true }
# Updates (docs/lm/update-feed.md): the Ed25519 signature and the disk image's SHA-256 (ring is
# already in the build through rustls), and the signature's base64.
ring = "0.17"
base64 = { workspace = true }

[features]
# The update dry run only (docs/lm/update-feed.md › Dry run): reads file:// feeds and disk images
# and passes LM_UPDATE_TEST_RELAUNCH_ARGS to the reopened app. Never in a release build.
update-test-hook = []

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
egui-wgpu = "0.36"
# Feature-unify wgpu so the noop backend is linked for headless CI without a GPU.
wgpu = { version = "30", features = ["noop"] }

# The system's preferred language on Windows, for the update notes (registry; safe API).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
