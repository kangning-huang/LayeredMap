[package]
name = "lm-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NimbleMap: the map-first shell"

[lints]
workspace = true

[dependencies]
lm-core = { path = "../lm-core" }
lm-actions = { path = "../lm-actions" }
lm-jobs = { path = "../lm-jobs" }
lm-doc = { path = "../lm-doc" }
lm-mapview = { path = "../lm-mapview" }
lm-ask = { path = "../lm-ask" }
lm-net = { path = "../lm-net" }
serde_json = { workspace = true }
egui = { workspace = true }
egui-phosphor = { version = "0.14", default-features = false, features = ["regular"] }
log = { workspace = true }
image = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }

# The system's preferred language on Windows, for the update notes (registry; safe API).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
