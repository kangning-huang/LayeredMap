[package]
name = "lm-ask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "NimbleMap Pro: the Ask box's assistant (plain-words requests to checked plans)"

[lints]
workspace = true

[dependencies]
lm-core = { path = "../lm-core" }
lm-jobs = { path = "../lm-jobs" }
lm-net = { path = "../lm-net" }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

# The system region on Windows (Country or region, from the registry): already in the build
# through embed-resource, and a safe API, so the crate stays free of unsafe code.
[target.'cfg(windows)'.dependencies]
winreg = "0.56"

# Developer OpenRouter key from the Keychain, and the system region from locale APIs
# (docs/lm/app-store.md › Command-line tools).
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
security-framework-sys = "2"
sys-locale = "0.3"
