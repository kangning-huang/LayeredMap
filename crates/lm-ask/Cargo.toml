[package]
name = "lm-ask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LayeredMap Pro: the Ask box's assistant (plain-words requests to checked plans)"

[lints]
workspace = true

[dependencies]
lm-core = { path = "../lm-core" }
lm-jobs = { path = "../lm-jobs" }
lm-net = { path = "../lm-net" }
log = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
