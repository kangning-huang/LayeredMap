# cargo-deny (WP6.8, Gate 5 license audit): `cargo deny check` — advisories, licenses, bans and
# sources for the whole workspace (RustGIS and NimbleMap). CI runs it in .github/workflows/lm-ci.yml;
# locally `cargo xtask audit` (it needs the network for the advisory database).

[graph]
# Every platform the workspace ships on.
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
  "wasm32-unknown-unknown",
]

[advisories]
# A crate that is no longer maintained fails the check only when a workspace crate uses it
# directly; transitive ones (egui's font parser, zbus on Linux) are reported by `cargo audit`.
unmaintained = "workspace"
ignore = [
  # zip 8: only calamine (the Excel reader, latest release 0.36.1) still uses it, and it reads
  # entries into memory; nothing in the workspace calls `extract` on a zip 8 archive. The crates
  # that do extract (rustgis-geolibre, rustgis-plugins) use zip 9, which is fixed. Drop these once
  # calamine moves to zip 9 (docs/lm/decisions.md, 2026-10-18).
  { id = "RUSTSEC-2026-0367", reason = "zip 8 via calamine only; extract() is never called on it" },
  { id = "RUSTSEC-2026-0368", reason = "zip 8 via calamine only; extract() is never called on it" },
  { id = "RUSTSEC-2026-0369", reason = "zip 8 via calamine only; extract() is never called on it" },
  # ttf-parser (unmaintained, not a vulnerability): lm-mapview reads only the fonts bundled in the
  # app with it, for PDF export, and egui's text rendering pulls it in through ab_glyph anyway.
  # Move to skrifa when ab_glyph does (docs/lm/decisions.md, 2026-10-19).
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser parses only the app's bundled fonts; also in the build through ab_glyph" },
  # zstd 0.13 / zstd-safe 7: only tiff 0.11.3 (latest on crates.io) still pulls them for GeoTIFF
  # zstd strips. Advisories are patched only in zstd >=0.14.3 / zstd-safe >=8.2.0; there is no
  # 0.13.x fix. Workspace zstd (parquet) is already on 0.14.3 / 8.2.0 / zstd-sys 2.1.2. Drop when
  # tiff releases with zstd 0.14 (image-rs/image-tiff main already does; docs/lm/decisions.md).
  { id = "RUSTSEC-2026-0391", reason = "zstd 0.13 via tiff 0.11.3; no 0.13.x patch; workspace zstd is 0.14.3" },
  { id = "RUSTSEC-2026-0398", reason = "zstd-safe 7 via tiff's zstd 0.13; patched only in >=8.2.0" },
  { id = "RUSTSEC-2026-0403", reason = "zstd-safe 7 via tiff's zstd 0.13; patched only in >=8.2.0" },
]

[licenses]
# Permissive licences, plus the fonts' and data licences that ship in the app.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
  "Unlicense",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  # webpki-roots: Mozilla's root certificates as data.
  "CDLA-Permissive-2.0",
  # epaint_default_fonts.
  "OFL-1.1",
  "Ubuntu-font-1.0",
  # colored (a test and command-line dependency): file-level copyleft; used unmodified.
  "MPL-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates that are never published (NimbleMap's, the xtask) are the project's own.
ignore = true

[bans]
# Duplicate versions are common across egui/wgpu/winit; report them, don't fail.
multiple-versions = "warn"
# The only version-less dependencies are the workspace's own path dependencies (RustGIS's crates
# are publishable, so `allow-wildcard-paths` doesn't cover them); a registry wildcard would show
# in review.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
